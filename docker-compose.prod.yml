name: stock-prediction-prod

x-common-env: &common-env
  env_file:
    - configs/config.env.prod

services:
  db:
    image: postgres:16-alpine
    container_name: stock-prediction-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # No host port publish — db is only reachable on the compose-internal
    # network by other services.

    networks:
      - isolated

    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  mlflow:
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    image: ghcr.io/mlflow/mlflow:v3.6.0
    container_name: stock-prediction-mlflow-prod

    # Internal-only, same as db/redis — nothing outside the compose network
    # needs to browse the MLflow UI directly.
    #
    # Needs "public" too: the base image doesn't bundle psycopg2, so the
    # command below installs it at startup, which requires internet egress.
    networks:
      - isolated
      - public

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    command: sh -c "pip install psycopg2-binary boto3 && mlflow server --backend-store-uri postgresql+psycopg2://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/mlflow --artifacts-destination s3://stock-prediction/prod/mlflow/ --serve-artifacts --host 0.0.0.0 --allowed-hosts '*'"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stock-prediction-redis-prod

    # No host port publish — internal only.
    networks:
      - isolated

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: stock-prediction-minio-prod

    # No host port publish — internal only.
    networks:
      - isolated

    volumes:
      - minio-data:/data

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: stock-prediction-minio-init-prod
    depends_on:
      minio:
        condition: service_healthy

    networks:
      - isolated

    environment:
      MC_HOST_minio: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000

    entrypoint: >
      /bin/sh -c "
      mc mb --ignore-existing minio/stock-prediction
      "

    restart: "no"

  grafana:
    <<: *common-env
    depends_on:
      db:
        condition: service_healthy

    image: grafana/grafana:13.0-slim
    container_name: stock-prediction-grafana-prod

    networks:
      - isolated
      - public

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    ports:
      - "9300:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  api:
    <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      target: api

    container_name: stock-prediction-fastapi-prod

    # No bind mounts — prod runs off what's baked into the image at build time.
    # Data storage is entirely backed by MinIO (s3:// URIs in settings).

    networks:
      - isolated
      - public

    environment:
      PYTHONPATH: /usr/local/app/src
      ENV_FILE: configs/config.env.prod
    ports:
      - "9000:8000"
    restart: unless-stopped

  ui:
    <<: *common-env
    depends_on:
      api:
        condition: service_healthy

    build:
      context: .
      target: ui

    container_name: stock-prediction-uis-prod

    networks:
      - isolated
      - public

    environment:
      PYTHONPATH: /usr/local/app/src
      API_HOST: api
      ENV_FILE: configs/config.env.prod
    ports:
      - "9501:8501"
    restart: unless-stopped
    command: streamlit run src/stock_prediction_ml/ui/app.py --server.port=8501 --server.address=0.0.0.0

  airflow-init:
    <<: *common-env
    build:
      context: .
      target: airflow
    container_name: stock-prediction-airflow-init-prod
    profiles: ["airflow"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - isolated
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      # Airflow 3's default SimpleAuthManager ignores `airflow users create`
      # and prints a random admin password to the logs on every restart.
      # Use the FAB RBAC auth manager instead so the admin user/password
      # below are the ones that actually work.
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      ENV_FILE: configs/config.env.prod
    command: |
      bash -c "
      airflow db migrate &&
      (airflow users create --username $AIRFLOW_ADMIN_USERNAME --firstname Raydi --lastname Tran --role Admin --email $AIRFLOW_ADMIN_EMAIL --password $AIRFLOW_ADMIN_PASSWORD || true) &&
      airflow variables set project_root /usr/local/app
      "

  airflow:
    <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    build:
      context: .
      target: airflow

    container_name: stock-prediction-airflow-prod

    profiles: ["airflow"]
    networks:
      - isolated
      - public
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # ALL_PASSWORDLESS dropped — that's a dev-only shortcut. Real users
      # are provisioned by airflow-init instead. LocalExecutor is fine to
      # keep for a single-box setup.
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      ENV_FILE: configs/config.env.prod

    volumes:
      # No ./orchestration/dags or ./src bind mounts — DAGs and app code
      # are baked into the image at build time (Dockerfile COPYs both),
      # same reasoning as api/ui.
      - airflow-logs:/opt/airflow/logs

    ports:
      - "9080:8080"

    # db migrate / users create already handled by airflow-init (one-time
    # setup this service depends_on: service_completed_successfully).
    # Each of these is a long-running process, so background them and
    # `wait -n` so the container exits (and gets restarted) if any one dies.
    command: >
      bash -c "
      airflow api-server --port 8080 &
      airflow scheduler &
      airflow dag-processor &
      airflow triggerer &
      wait -n
      "

volumes:
  postgresql_data:
  redis-data:
  minio-data:
  airflow-logs:
  grafana-data:
  data:

networks:
  isolated:
    internal: true   # No external connectivity
  public:   # Standard bridge network, created by Compose on docker compose up