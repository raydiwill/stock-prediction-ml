[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock_prediction_ml"
version = "0.1.0"
description = "Personal portfolio project for stock price prediction using E2E ML model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.8",
    "fastapi>=0.121.3",
    "feast>=0.50.0",
    "great-expectations>=1.8.1",
    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.8",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.7",
    "mlflow>=3.6.0",
    "optuna>=4.6.0",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.12.0",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "sqlalchemy>=2.0.44",
    "tqdm>=4.67.1",
    "xgboost>=3.1.1",
]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_prediction_ml"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore::marshmallow.warnings.ChangedInMarshmallow4Warning",
]

[tool.ruff.lint]
select = ["E","F","I","UP"]

[tool.ruff.lint.isort]
known-first-party = ["stock_prediction_ml"]
