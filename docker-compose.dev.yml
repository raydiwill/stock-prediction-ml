name: stock-prediction-dev

x-common-env: &common-env
  env_file:
    - configs/config.env.dev

services:
  db:
    image: postgres:16-alpine
    container_name: stock-prediction-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    image: ghcr.io/mlflow/mlflow:v3.6.0

    container_name: stock-prediction-mlflow-dev
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    command: sh -c "pip install psycopg2-binary boto3 && mlflow server --backend-store-uri postgresql+psycopg2://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/mlflow --artifacts-destination s3://stock-prediction/dev/mlflow/ --serve-artifacts --host 0.0.0.0 --allowed-hosts '*'"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: stock-prediction-redis-dev
    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: stock-prediction-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: stock-prediction-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy

    environment:
      MC_HOST_minio: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000

    entrypoint: >
      /bin/sh -c "
      mc mb --ignore-existing minio/stock-prediction
      "

  api:
    <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      target: api

    container_name: stock-prediction-fastapi-dev
    volumes:
      - ./src:/usr/local/app/src
      - ./configs:/usr/local/app/configs

    environment:
      PYTHONPATH: /usr/local/app/src
      ENV_FILE: configs/config.env.dev
    ports:
      - "8000:8000"
    restart: "no"
    command: uvicorn stock_prediction_ml.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /usr/local/app/src

  ui:
    <<: *common-env
    depends_on:
      api:
        condition: service_healthy

    build:
      context: .
      target: ui

    container_name: stock-prediction-uis-dev
    volumes:
      - ./src:/usr/local/app/src
      - ./configs:/usr/local/app/configs
    environment:
      PYTHONPATH: /usr/local/app/src
      API_HOST: api
      ENV_FILE: configs/config.env.dev
    ports:
      - "8501:8501"
    restart: "no"
    command: streamlit run src/stock_prediction_ml/ui/app.py --server.port=8501 --server.address=0.0.0.0

  airflow-init:
    <<: *common-env
    build:
      context: .
      target: airflow
    container_name: stock-prediction-airflow-init-dev
    profiles: ["airflow"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/airflow
      ENV_FILE: configs/config.env.dev
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create \
          --username $$AIRFLOW_ADMIN_USERNAME \
          --firstname Raydi \
          --lastname Tran \
          --role Admin \
          --email $$AIRFLOW_ADMIN_EMAIL \
          --password $$AIRFLOW_ADMIN_PASSWORD || true) &&
      airflow variables set project_root /usr/local/app
      "

  airflow:
    <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    build:
      context: .
      target: airflow

    container_name: stock-prediction-airflow-dev

    profiles: ["airflow"]

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      ENV_FILE: configs/config.env.dev

    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./src:/usr/local/app/src
      - ./configs:/usr/local/app/configs
      - airflow-logs:/opt/airflow/logs

    ports:
      - "8080:8080"

    # db migrate / users create already handled by airflow-init (one-time
    # setup this service depends_on: service_completed_successfully).
    # Each of these is a long-running process, so background them and
    # `wait -n` so the container exits (and gets restarted) if any one dies.
    command: >
      bash -c "
      airflow api-server --port 8080 &
      airflow scheduler &
      airflow dag-processor &
      airflow triggerer &
      wait -n
      "

  grafana:
    <<: *common-env
    depends_on:
      db:
        condition: service_healthy

    image: grafana/grafana:13.0-slim
    container_name: stock-prediction-grafana-dev
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgresql_data:
  mlflow-data:
  redis-data:
  minio-data:
  airflow-logs:
  grafana-data: