services:
  db:
    image: postgres:16-alpine
    container_name: stock-prediction-db
    environment:
      POSTGRES_DB: dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass

    ports:
      - "5432:5432"

    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    depends_on:
      db:
        condition: service_healthy
    image: ghcr.io/mlflow/mlflow:v3.6.0

    container_name: stock-prediction-mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow

    command: sh -c "pip install psycopg2-binary && mlflow server --backend-store-uri postgresql+psycopg2://user:pass@db:5432/mlflow --artifacts-destination /mlflow/artifacts --serve-artifacts --host 0.0.0.0 --allowed-hosts '*'"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: stock-prediction-redis
    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      target: api

    container_name: stock-prediction-fastapi
    volumes:
      - ./src:/usr/local/app/src
      - ./data:/usr/local/app/data
      - ./configs:/usr/local/app/configs

    env_file:
      - configs/config.env.dev
    environment:
      PYTHONPATH: /usr/local/app/src
    ports:
      - "8000:8000"
    restart: "no"
    command: uvicorn stock_prediction_ml.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /usr/local/app/src

  ui:
    depends_on:
      api:
        condition: service_healthy

    build:
      context: .
      target: ui

    container_name: stock-prediction-uis
    volumes:
      - ./src:/usr/local/app/src
      - ./configs:/usr/local/app/configs
    env_file:
      - configs/config.env.dev
    environment:
      PYTHONPATH: /usr/local/app/src
      API_HOST: api
    ports:
      - "8501:8501"
    restart: "no"
    command: streamlit run src/stock_prediction_ml/ui/app.py --server.port=8501 --server.address=0.0.0.0

  airflow-init:
    build:
      context: .
      target: airflow
    profiles: ["airflow"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user:pass@db:5432/airflow
    command: bash -c "airflow db migrate && airflow variables set project_root /usr/local/app"

  airflow:
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    build: 
      context: .
      target: airflow

    profiles: ["airflow"]
    env_file:
      - configs/config.env.dev

    environment:
      AIRFLOW__SIMPLE_AUTH_MANAGER__ALL_PASSWORDLESS: "true"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user:pass@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./src:/usr/local/app/src
      - ./configs:/usr/local/app/configs
      - airflow-logs:/opt/airflow/logs

    ports:
      - "8080:8080"

    command: airflow standalone

volumes:
  postgresql_data:
  mlflow-data:
  redis-data:
  data:
  airflow-logs: